name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Uses the pnpm version from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (dependency boundaries + formatting)
        run: pnpm lint

      - name: Test (unit + Store interface tests)
        run: pnpm test

      - name: Build
        run: pnpm build

      # Fails if the Drizzle schema has changes without a generated migration, or if the
      # migrations do not apply on top of the previous release's database.
      - name: Migration check
        run: pnpm --filter @searchkeep/store-d1 run db:check

      - name: Worker bundle size
        run: pnpm --filter @searchkeep/cloudflare run size

  # Rehearses exactly what Workers Builds runs on a user's fork: install from the
  # Worker's root directory, the build command, then a wrangler dry-run deploy.
  workers-builds:
    name: workers-builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cloudflare
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/cloudflare/.node-version
          cache: pnpm
      - name: Install (as Workers Builds does, from the root directory)
        run: pnpm install --frozen-lockfile
      - name: Build command
        run: pnpm run build
      - name: Deploy command (dry run)
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
