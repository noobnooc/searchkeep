version: 2
updates:
  # pnpm workspaces use the npm ecosystem.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ['type:chore']
    commit-message:
      prefix: 'chore(deps)'
    groups:
      cloudflare:
        patterns: ['wrangler', '@cloudflare/*']
        update-types: ['minor', 'patch']
      svelte:
        patterns: ['svelte', '@sveltejs/*', 'vite', '@vitejs/*']
        update-types: ['minor', 'patch']
      dev-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']
      production-dependencies:
        dependency-type: production
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ['type:chore']
    commit-message:
      prefix: 'chore(ci)'
    groups:
      github-actions:
        patterns: ['*']
